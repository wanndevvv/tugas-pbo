<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Program Validasi Izin Terbang Drone - Nested If Else</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Inter", sans-serif;
      }
      code,
      pre {
        font-family: "Fira Code", monospace;
      }
    </style>
  </head>
  <body
    class="bg-slate-100 text-slate-800 min-h-screen py-8 px-4 flex items-center justify-center"
  >
    <div
      class="max-w-2xl w-full bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden"
    >
      <!-- Header -->
      <div class="bg-slate-900 text-white p-6 sm:p-8">
        <div class="flex items-center space-x-3 mb-2">
          <span class="text-xs text-slate-400">Simulasi If-Else Bersarang</span>
        </div>
        <h1 class="text-2xl sm:text-3xl font-bold tracking-tight">
          Cek Izin Terbang Drone
        </h1>
        <p class="text-slate-400 text-sm mt-1">
          Cek kondisi drone secara otomatis sebelum diterbangkan.
        </p>
      </div>

      <!-- Form Input & Content -->
      <div class="p-6 sm:p-8 space-y-6">
        <!-- Form Pengecekan -->
        <form id="formDrone" class="space-y-5">
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <!-- 1. GPS -->
            <label
              for="gps"
              class="bg-slate-50 p-4 rounded-xl border border-slate-200 flex items-center justify-between cursor-pointer hover:bg-slate-100/80 transition-colors"
            >
              <div>
                <span class="font-semibold text-sm text-slate-700 block"
                  >Sinyal GPS</span
                >
                <span class="text-xs text-slate-500">Status satelit GPS</span>
              </div>
              <input
                type="checkbox"
                id="gps"
                checked
                class="w-5 h-5 text-indigo-600 rounded focus:ring-indigo-500 cursor-pointer"
              />
            </label>

            <!-- 2. Zona Terlarang -->
            <label
              for="zonaTerlarang"
              class="bg-slate-50 p-4 rounded-xl border border-slate-200 flex items-center justify-between cursor-pointer hover:bg-slate-100/80 transition-colors"
            >
              <div>
                <span class="font-semibold text-sm text-slate-700 block"
                  >Zona Terlarang</span
                >
                <span class="text-xs text-slate-500">Bandara / Militer</span>
              </div>
              <input
                type="checkbox"
                id="zonaTerlarang"
                class="w-5 h-5 text-rose-600 rounded focus:ring-rose-500 cursor-pointer"
              />
            </label>
          </div>

          <!-- Input Baterai -->
          <div class="space-y-4 pt-2">
            <div>
              <div class="flex justify-between items-center mb-1">
                <label
                  for="baterai"
                  class="font-semibold text-sm text-slate-700"
                  >Daya Baterai</label
                >
                <span
                  id="teksBaterai"
                  class="text-sm font-bold font-mono text-indigo-600"
                  >75%</span
                >
              </div>
              <input
                type="range"
                id="baterai"
                min="0"
                max="100"
                value="75"
                class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-indigo-600"
              />
            </div>
          </div>

          <!-- Tombol Cek -->
          <button
            type="submit"
            class="w-full bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-bold py-3.5 px-6 rounded-xl shadow-lg shadow-indigo-600/30 transition-all duration-200 flex items-center justify-center space-x-2 text-base cursor-pointer"
          >
            <svg
              class="w-5 h-5"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"
              ></path>
            </svg>
            <span>Cek Status Drone</span>
          </button>
        </form>

        <!-- Kotak Hasil -->
        <div
          id="kotakHasil"
          class="mt-6 p-5 rounded-xl border transition-all duration-300 bg-emerald-50 border-emerald-300 text-emerald-900"
        >
          <div class="flex items-center justify-between mb-2">
            <span
              class="text-xs font-bold uppercase tracking-wider text-emerald-700"
              id="judulHasil"
              >STATUS PENGECEKAN</span
            >
            <span
              id="badgeHasil"
              class="text-xs font-mono font-bold px-2.5 py-1 rounded-md bg-emerald-200 text-emerald-800"
            >
              [IZIN DIBERIKAN]
            </span>
          </div>
          <p
            id="pesanHasil"
            class="font-mono text-sm leading-relaxed font-semibold"
          >
            [IZIN DIBERIKAN] Sinyal aman, baterai cukup, dan lokasi bebas. Drone siap Takeoff!
          </p>
        </div>
      </div>
    </div>

    <script>
      // Ambil elemen HTML
      const formDrone = document.getElementById("formDrone");
      const inputGps = document.getElementById("gps");
      const inputZona = document.getElementById("zonaTerlarang");
      const inputBaterai = document.getElementById("baterai");
      const teksBaterai = document.getElementById("teksBaterai");

      const kotakHasil = document.getElementById("kotakHasil");
      const badgeHasil = document.getElementById("badgeHasil");
      const pesanHasil = document.getElementById("pesanHasil");

      // Pilihan warna kotak hasil
      const temaWarna = {
        sukses: {
          kotak: "mt-6 p-5 rounded-xl border transition-all duration-300 bg-emerald-50 border-emerald-300 text-emerald-900",
          badge: "text-xs font-mono font-bold px-2.5 py-1 rounded-md bg-emerald-200 text-emerald-800",
        },
        bahaya: {
          kotak: "mt-6 p-5 rounded-xl border transition-all duration-300 bg-rose-50 border-rose-300 text-rose-900",
          badge: "text-xs font-mono font-bold px-2.5 py-1 rounded-md bg-rose-200 text-rose-800",
        },
      };

      function updateBaterai() {
        teksBaterai.textContent = `${inputBaterai.value}%`;
      }

      function tampilkanHasil(pesan, badge, status) {
        pesanHasil.textContent = pesan;
        badgeHasil.textContent = badge;

        const tema = temaWarna[status] || temaWarna.bahaya;
        kotakHasil.className = tema.kotak;
        badgeHasil.className = tema.badge;
      }

      function cekStatus() {
        // Ambil nilai input
        const gps = inputGps.checked;
        const baterai = parseInt(inputBaterai.value, 10);
        const zonaTerlarang = inputZona.checked;

        let pesan = "";
        let badge = "";
        let status = "sukses";

        // Logika If Bersarang (Nested If)
        if (gps) {
          if (baterai >= 20) {
            if (!zonaTerlarang) {
              status = "sukses";
              badge = "[IZIN DIBERIKAN]";
              pesan = "[IZIN DIBERIKAN] Sinyal aman, baterai cukup, dan lokasi bebas. Drone siap Takeoff!";
            } else {
              status = "bahaya";
              badge = "[TAKEOFF DITOLAK]";
              pesan = "[TAKEOFF DITOLAK] Drone berada di No-Fly Zone (Zona Terbatas)!";
            }
          } else {
            status = "bahaya";
            badge = "[TAKEOFF DITOLAK]";
            pesan = "[TAKEOFF DITOLAK] Baterai terlalu rendah (Di bawah 20%)!";
          }
        } else {
          status = "bahaya";
          badge = "[TAKEOFF DITOLAK]";
          pesan = "[TAKEOFF DITOLAK] Sinyal GPS tidak ditemukan!";
        }

        // Tampilkan juga di console
        console.log(pesan);

        // Perbarui tampilan
        tampilkanHasil(pesan, badge, status);
      }

      // Event listener tombol submit
      formDrone.addEventListener("submit", (e) => {
        e.preventDefault();
        cekStatus();
      });

      // Update saat slider baterai digeser
      inputBaterai.addEventListener("input", () => {
        updateBaterai();
        cekStatus();
      });

      // Cek ulang saat status checkbox berubah
      inputGps.addEventListener("change", cekStatus);
      inputZona.addEventListener("change", cekStatus);

      // Jalankan sekali saat halaman pertama kali dibuka
      window.addEventListener("DOMContentLoaded", () => {
        updateBaterai();
        cekStatus();
      });
    </script>
  </body>
</html>
